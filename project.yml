# Xcode-project voor W.S.P op iPhone. Het .xcodeproj maakt GitHub Actions hier zelf van (xcodegen generate),
# dus er hoeft geen Mac aan te pas te komen. Versie: MARKETING_VERSION hieronder (bij beide targets gelijk houden).
name: IchthusPlus
options:
  bundleIdPrefix: nl.cijferpacks
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    # niet ondertekend bouwen: SideStore ondertekent de app zelf met je eigen Apple ID
    # (de app group staat in de .entitlements; die zet de build er met ldid in, zodat SideStore hem ziet)
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  IchthusPlus:
    type: application
    platform: iOS
    sources:
      - path: IchthusPlus
        excludes: ["*.entitlements"]
      # app.js, lettertypes en plaatjes: dezelfde bestanden als in de Android-app (sync.ps1 kopieert ze hierheen)
      - path: web
        type: folder
        buildPhase: resources
    dependencies:
      - target: IchthusWidget
        embed: true
    info:
      path: IchthusPlus/Info.plist
      properties:
        CFBundleDisplayName: W.S.P
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: true
        # af en toe op de achtergrond kijken naar nieuwe cijfers, huiswerk en roosterwijzigingen
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [nl.cijferpacks.app.refresh]
        # ichthusplus://rooster: tikken op de widget
        CFBundleURLTypes:
          - CFBundleURLName: nl.cijferpacks.app
            CFBundleURLSchemes: [ichthusplus]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.cijferpacks.app
        PRODUCT_NAME: IchthusPlus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Kaal AppIcon-Zwart AppIcon-Wit"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

  # widget "volgende les" (iOS 16 en nieuwer, ook op het toegangsscherm)
  IchthusWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: IchthusWidget
        excludes: ["*.entitlements"]
    info:
      path: IchthusWidget/Info.plist
      properties:
        CFBundleDisplayName: W.S.P
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.cijferpacks.app.widget
        PRODUCT_NAME: IchthusWidget
        SKIP_INSTALL: YES
