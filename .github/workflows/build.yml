# Bouwt Ichthus+ voor iPhone op een Mac van GitHub en maakt er een (niet-ondertekende) .ipa van.
# SideStore ondertekent hem daarna zelf met je eigen Apple ID.
# - elke push: test-build, de .ipa staat bij de run onder "Artifacts"
# - een tag v* (bijv. v0.1.0): ook een release met de .ipa erbij
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-project maken
        run: |
          brew install xcodegen ldid
          xcodegen generate

      - name: Bouwen
        run: |
          xcodebuild -project IchthusPlus.xcodeproj -target IchthusPlus -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u; tail -n 60 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -n 30 || true
          tail -n 5 build.log
          test -d build/Release-iphoneos/IchthusPlus.app

      - name: .ipa maken
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/IchthusPlus.app Payload/
          # de app group erin zetten (eerst de widget, dan de app), zodat SideStore hem voor beide aanvraagt
          ldid -SIchthusWidget/IchthusWidget.entitlements Payload/IchthusPlus.app/PlugIns/IchthusWidget.appex/IchthusWidget
          ldid -SIchthusPlus/IchthusPlus.entitlements Payload/IchthusPlus.app/IchthusPlus
          ldid -e Payload/IchthusPlus.app/IchthusPlus
          zip -qry IchthusPlus.ipa Payload
          ls -l IchthusPlus.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: IchthusPlus-ipa
          path: IchthusPlus.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # bron voor SideStore (Sources → +): https://github.com/<repo>/releases/latest/download/source.json
          V="${GITHUB_REF_NAME#v}"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/IchthusPlus.ipa"
          ICON="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/IchthusPlus/Assets.xcassets/AppIcon.appiconset/icon.png"
          jq -n --arg v "$V" --arg url "$URL" --arg icon "$ICON" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson size "$(stat -f%z IchthusPlus.ipa)" '{
              name: "Ichthus+", identifier: "nl.cijferpacks.source", iconURL: $icon,
              apps: [{ name: "Ichthus+", bundleIdentifier: "nl.cijferpacks.app", developerName: "Ichthus+",
                localizedDescription: "Cijfers, rooster en huiswerk van het leerlingenportaal in één app.",
                iconURL: $icon, tintColor: "FFD34D",
                versions: [{ version: $v, date: $date, downloadURL: $url, size: $size, minOSVersion: "15.0" }],
                appPermissions: { entitlements: [], privacy: {} } }],
              news: [] }' > source.json
          gh release create "$GITHUB_REF_NAME" IchthusPlus.ipa source.json --title "Ichthus+ iPhone $V" \
            --notes "Installeren via SideStore: My Apps, plus, kies IchthusPlus.ipa. Of voeg de bron toe in SideStore (Sources)."

  # zonder iPhone testen: de app in de iPhone-simulator van de Mac starten en schermafbeeldingen maken.
  # Ook een simulator-build (IchthusPlus-simulator.zip) om te uploaden naar appetize.io, dan bedien je hem in je browser.
  # Kost extra Mac-minuten, dus alleen met de hand (Actions → Build → Run workflow) of met [sim] in de commit.
  simulator:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sim]')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-project maken
        run: |
          brew install xcodegen
          # demo met voorbeeldgegevens erbij (alleen in deze build), zodat je zonder in te loggen kunt testen
          cp demo/demo.html web/demo.html
          xcodegen generate

      - name: Bouwen voor de simulator
        run: |
          xcodebuild -project IchthusPlus.xcodeproj -target IchthusPlus -configuration Debug -sdk iphonesimulator \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO OTHER_SWIFT_FLAGS='$(inherited) -D DEMO' build > sim.log 2>&1 \
            || { grep -E "error:" sim.log | sort -u; tail -n 60 sim.log; exit 1; }
          cd build/Debug-iphonesimulator && zip -qry ../../IchthusPlus-simulator.zip IchthusPlus.app

      - name: Starten en schermafbeeldingen maken
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone 1[5-9]( Pro)?$"))][0].udid')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/IchthusPlus.app
          mkdir -p shots
          xcrun simctl launch "$UDID" nl.cijferpacks.app
          sleep 8;  xcrun simctl io "$UDID" screenshot shots/1-opstart.png
          sleep 20; xcrun simctl io "$UDID" screenshot shots/2-na-30s.png
          # widget-test: de app is nu gestart; het beginscherm laten zien
          xcrun simctl ui "$UDID" appearance dark
          sleep 3;  xcrun simctl io "$UDID" screenshot shots/3-donker.png
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "IchthusPlus"' --style compact | tail -n 80 > shots/log.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots

      - uses: actions/upload-artifact@v4
        with:
          name: IchthusPlus-simulator
          path: IchthusPlus-simulator.zip
