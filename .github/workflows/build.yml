# Bouwt W.S.P voor iPhone op een Mac van GitHub en maakt er een (niet-ondertekende) .ipa van.
# SideStore ondertekent hem daarna zelf met je eigen Apple ID.
# - elke push: test-build, de .ipa staat bij de run onder "Artifacts"
# - een tag v* (bijv. v0.1.0): ook een release met de .ipa erbij
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-project maken
        run: |
          brew install xcodegen ldid
          xcodegen generate

      - name: Bouwen
        env:
          # geheim ntfy-onderwerp voor foutmeldingen (Settings → Secrets → Actions); staat zo niet in de openbare code
          WSP_CRASH_TOPIC: ${{ secrets.WSP_CRASH_TOPIC }}
        run: |
          xcodebuild -project IchthusPlus.xcodeproj -target IchthusPlus -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" WSP_CRASH_TOPIC="$WSP_CRASH_TOPIC" build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u; tail -n 60 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -n 30 || true
          tail -n 5 build.log
          test -d build/Release-iphoneos/IchthusPlus.app

      - name: .ipa maken
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/IchthusPlus.app Payload/
          # de app group erin zetten (eerst de widget, dan de app), zodat SideStore hem voor beide aanvraagt
          ldid -SIchthusWidget/IchthusWidget.entitlements Payload/IchthusPlus.app/PlugIns/IchthusWidget.appex/IchthusWidget
          ldid -SIchthusPlus/IchthusPlus.entitlements Payload/IchthusPlus.app/IchthusPlus
          ldid -e Payload/IchthusPlus.app/IchthusPlus
          zip -qry WSP.ipa Payload
          ls -l WSP.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: IchthusPlus-ipa
          path: WSP.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" WSP.ipa --title "W.S.P iPhone $V" \
            --notes "Installeren via SideStore: My Apps, plus, kies WSP.ipa. De uitleg staat op de hoofdpagina."
